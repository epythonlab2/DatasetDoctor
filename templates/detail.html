<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DatasetDoctor | ML Insights Hub</title>
    <meta
      name="description"
      content="Diagnose ML readiness with Dataset Doctor. Automate data cleaning, outlier detection, data leakage checks, handle missing data, and fix mismatches fast."
    />

    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />

    <!-- ==========================================
         STYLESHEETS
         ========================================== -->
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/custom_dialog.css" />
    <link rel="stylesheet" href="/static/css/land_page.css" />
    <link rel="stylesheet" href="/static/css/insights.css" />

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ICONS -->
    <script
      src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js"
      defer
    ></script>
  </head>
  <body>
  
    {% include 'includes/index_nav.html' %}
   
    <main >
     <div class="progress-container"><div id="progress-bar"></div></div>
    <header class="article-hero" id="article-hero">
    </header>

	<article class="article-body" id="article-body">
  	
  	  </article>
      
    	 <section class="related-articles">
	    <div class="content-width">
		<h2 style="font-size: 1.5rem; margin-bottom: 2rem; color: #0f172a;">Related Insights</h2>
		
		<div class="related-grid" id="related-grid">
		    <p>Loading related insights...</p>
		</div>
	    </div>
	</section>
    </main>

    <!-- ==========================================
         FOOTER
         ========================================== -->
    {% include 'includes/sticky_footer.html' %}

    <script type="module">
    import { loadArticleDetail, fetchRelatedInsights } from '/static/js/insight/insight_detail.js';

    document.addEventListener("DOMContentLoaded", () => {
        const currentSlug = "{{ slug }}";
        
        // Initialize everything
        lucide.createIcons();
        loadArticleDetail(currentSlug);
        fetchRelatedInsights(currentSlug);

        // Progress bar logic remains here if it's page-specific
        window.addEventListener('scroll', () => {
            const scrolled = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";
        });
    });
</script>
  </body>
</html>
