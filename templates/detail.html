<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DatasetDoctor | ML Insights Hub</title>
    <meta
      name="description"
      content="Diagnose ML readiness with Dataset Doctor. Automate data cleaning, outlier detection, data leakage checks, handle missing data, and fix mismatches fast."
    />

    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />

    <!-- ==========================================
         STYLESHEETS
         ========================================== -->
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/custom_dialog.css" />
    <link rel="stylesheet" href="/static/css/land_page.css" />
    <link rel="stylesheet" href="/static/css/insights.css" />

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ICONS -->
    <script
      src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js"
      defer
    ></script>
  </head>
  <body>
      <!-- Loading State -->
    <div id="fullscreen-loader" class="fullscreen-loader">
      <div class="loader-content">
        <div class="brand-logo">
          <img src="/static/icons/favicon.svg" alt="Logo" />
        </div>
        <div class="loader-progress-track">
          <div id="loader-progress-bar" class="loader-progress-bar"></div>
        </div>
      </div>
    </div>
  
    {% include 'includes/index_nav.html' %}
   
    <main >
     	<div class="progress-container"><div id="progress-bar"></div></div>
	    <header class="article-hero" id="article-hero">
	    	
	    </header>
	    <div class="dashboard-wrapper article-page-wrapper">
		<article class="article-body" id="article-body">
		
		</article>

		<aside class="article-sidebar">
		    <div class="sidebar-widget">
		        <h4 class="sidebar-title">Key Takeaways</h4>
		        <ul id="takeaways-list" class="takeaways-list"></ul>
		    </div>
		    <div class="sidebar-widget">
			    <h4 class="sidebar-title">Quick Actions</h4>
			    
			    <button id="btn-save" class="sidebar-btn">
				<i data-lucide="bookmark" size="18"></i>
				Save to Favorites
			    </button>
			    
			    <button id="btn-share" class="sidebar-btn">
				<i data-lucide="share-2" size="18"></i>
				Share Insight
			    </button>
			</div>
		</aside>
	    </div>
	    
	   
	    <section class="related-articles">
		  <div class="content-width">
		  	<h2 style="margin-bottom: 1rem;" id="header_text">Read More</h2>
			<div class="related-list" id="related-list">
			
			    </div>
		   </div>
	    </section>
    </main>

    <!-- ==========================================
         FOOTER
         ========================================== -->
    {% include 'includes/sticky_footer.html' %}

    <script type="module">
	    import { loadArticleDetail, fetchRelatedInsights } from '/static/js/insight/insight_detail.js';
	    import { initLoader, withLoader, initScrollProgress, showErrorState } from "/static/js/insight/load_state.js";

	    document.addEventListener("DOMContentLoaded", async () => {
		const currentSlug = "{{ slug }}";
		
		// Initialize UI components
		lucide.createIcons();
		initLoader();
		initScrollProgress();

		try {
		    // Combine both fetches into a single promise using Promise.all
		    await withLoader(
		        Promise.all([
		            loadArticleDetail(currentSlug),
		            fetchRelatedInsights(currentSlug)
		        ]), 
		        "Loading insights..."
		    );
		} catch (err) {
		    console.error("Failed to load insights:", err);
		    showErrorState();
		}
	    });

	     
      </script>
  </body>
</html>
