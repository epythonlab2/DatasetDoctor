<div class="hero-glow"></div>
<nav class="navbar navbar-landing">
    <div class="dashboard-wrapper nav-content">
        <!-- Brand identity block -->
        <div class="nav-header-brand">
            <div class="logo nav-logo-link" onclick="window.location.href='/'">
                <i data-lucide="activity" class="icon-primary"></i> DatasetDoctor
            </div>
            
            <button class="nav-toggle" id="nav-menu-toggle" aria-label="Toggle navigation">
                <i data-lucide="menu" class="icon-toggle"></i>
            </button>
        </div>
        
        <!-- Action items -->
        <div class="nav-actions nav-actions-wrapper" id="nav-menu-actions">
            <a class="nav-link" href="/insights">
                <i data-lucide="sparkles" class="icon-nav"></i>
                <span>Insights</span>
            </a>
            
            <a class="nav-link" href="#features">
                <i data-lucide="shield-check" class="icon-nav"></i>
                <span>Audit Suite</span>
            </a>
            <button class="btn btn-primary" id="launch-engine-btn">
                <i data-lucide="zap" class="icon-sm"></i> 
                <span>Upload CSV</span>
            </button>
        </div>
    </div>
</nav>



<script>
document.addEventListener('DOMContentLoaded', () => {
    // Initial icon render
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }

    const toggleBtn = document.getElementById('nav-menu-toggle');
    const navMenu = document.getElementById('nav-menu-actions');

    if (toggleBtn && navMenu) {
        toggleBtn.addEventListener('click', () => {
            toggleBtn.classList.toggle('active');
            navMenu.classList.toggle('active');

            // Find the element inside the button. 
            // It might be an <i> OR an <svg> depending on the state.
            const icon = toggleBtn.querySelector('i') || toggleBtn.querySelector('svg');
            
            if (icon) {
                const isMenuActive = toggleBtn.classList.contains('active');
                
                // If it's an <svg>, we need to remove it and put an <i> back 
                // so Lucide can re-initialize it, OR just swap the data-lucide attribute.
                // The cleanest way is to reset the icon to an <i> tag:
                toggleBtn.innerHTML = `<i data-lucide="${isMenuActive ? 'x' : 'menu'}"></i>`;
                
                // Re-run Lucide
                lucide.createIcons();
            }
        });
    }
});
</script>
