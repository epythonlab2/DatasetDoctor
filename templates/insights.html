<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DatasetDoctor | ML Insights Hub</title>
    <meta name="description" content="Data Engineering Insights, ML insights. Automate data cleaning, outlier detection, data leakage checks, handle missing data, and fix mismatches fast." />
    
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />

    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/custom_dialog.css" />
    <link rel="stylesheet" href="/static/css/land_page.css" />
    <link rel="stylesheet" href="/static/css/insights.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js" defer></script>
  </head>
  <body>
   
    <!-- Loading State -->
    <div id="fullscreen-loader" class="fullscreen-loader">
      <div class="loader-content">
        <div class="brand-logo">
          <img src="/static/icons/favicon.svg" alt="Logo" />
        </div>
        <div class="loader-progress-track">
          <div id="loader-progress-bar" class="loader-progress-bar"></div>
        </div>
      </div>
    </div>
  
    {% include 'includes/index_nav.html' %}

    <main class="dashboard-wrapper">
      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>
      
      <header class="hero-section">
        <h1 class="hero-title">Insights for <span>Data-Centric AI</span></h1>
        <p class="hero-subtitle">Master the methodologies for building high-fidelity datasets.</p>

        <div class="search-container">
          <i data-lucide="search" class="search-icon" size="20"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Search patterns..." />
        </div>

        <div class="filter-row" id="filterContainer">
          <button class="filter-btn active" data-category="all">All Topics</button>
          <button class="filter-btn" data-category="Validation">Validation</button>
          <button class="filter-btn" data-category="Cleaning">Cleaning</button>
          <button class="filter-btn" data-category="Leakage">Leakage</button>
          <button class="filter-btn" data-category="Detection">Detection</button>
        </div>
      </header>

      <section class="featured-insight" id="featuredSection"></section>

      <div class="insights-grid" id="insightsGrid"></div>

      <div id="emptyState" style="display: none; text-align: center; padding: 4rem 0">
        <i data-lucide="search-x" size="48" style="color: var(--secondary); margin-bottom: 1rem"></i>
        <h3>No results found</h3>
        <p style="color: var(--text-muted)">Try adjusting your search terms or filters.</p>
      </div>
    </main>

    {% include 'includes/sticky_footer.html' %}

    <script type="module">
      import { fetchAndRender, setSearchQuery, setActiveCategory } from '/static/js/insight/insights_gallery.js';
      import { initLoader, withLoader, initScrollProgress, showErrorState } from "/static/js/insight/load_state.js";

      // Initialize UI and Data
      document.addEventListener("DOMContentLoaded", async () => {
        lucide.createIcons();
        initLoader();
        bindEvents();
        initScrollProgress();

        try {
          // Fetch initial data with loader overlay
          await withLoader(fetchAndRender(), "Loading insights...");
        } catch (err) {
          console.error("Failed to load insights:", err);
          showErrorState();
        }
      });

      // Event Listeners for UI interaction
      function bindEvents() {
        document.getElementById("searchInput")?.addEventListener("input", (e) => setSearchQuery(e.target.value));
        document.querySelectorAll(".filter-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            document.querySelector(".filter-btn.active")?.classList.remove("active");
            e.currentTarget.classList.add("active");
            setActiveCategory(e.currentTarget.dataset.category);
          });
        });
      }

     
    </script>
  </body>
</html>
